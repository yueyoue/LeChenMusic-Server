name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase repository name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: cd ui && npm ci

      - name: Build UI
        run: cd ui && npm run build -- --outDir=../ui/build

      - name: Build Go binary
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          GIT_TAG=$(git describe --tags --always --dirty 2>/dev/null || echo "$GIT_SHA")
          go build -tags netgo,sqlite_fts5 \
            -ldflags="-w -s -X github.com/navidrome/navidrome/consts.GitSHA=${GIT_SHA} -X github.com/navidrome/navidrome/consts.GitTag=${GIT_TAG}" \
            -o navidrome .

      - name: Detect image-relevant changes
        id: changes
        # Docs-only commits must not rebuild/push multi-arch images: every push burns
        # registry data quota (buildx "toomanyrequests: Data limit exceeded").
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # force-push / 重推时 BEFORE 指向的 commit 可能已不在历史里，git diff 会失败。
          # 此时必须默认构建：ff5262c 那次就是被误判成“仅文档改动”静默跳过了镜像发布，
          # 导致 GHCR 的 :latest 一直停在旧版本，用户 docker compose pull 拉不到新版。
          if ! CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null); then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Cannot diff $BEFORE..${{ github.sha }} (force-push?), building image to be safe"
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Empty diff against $BEFORE, building image to be safe"
            exit 0
          fi
          if printf '%s\n' "$CHANGED" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: skipping image build/push to save registry quota"
          fi

      - name: Set up QEMU
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.changes.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        if: steps.changes.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        id: docker-push
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}

      - name: Debug push failure
        if: steps.changes.outputs.build == 'true' && steps.docker-push.outcome == 'failure'
        run: |
          echo "❌ Docker push failed!"
          echo "Outcome: ${{ steps.docker-push.outcome }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Waiting 90s for registry rate/data window, then retrying single-platform push..."
          sleep 90
          docker build -t ghcr.io/${{ env.REPO_LOWER }}:latest .
          docker push ghcr.io/${{ env.REPO_LOWER }}:latest 2>&1 || echo "Single push also failed"

      - name: Fail if push failed
        if: steps.changes.outputs.build == 'true' && steps.docker-push.outcome == 'failure'
        run: exit 1

      - name: Verify GHCR push
        if: steps.changes.outputs.build == 'true'
        run: |
          echo "=== Docker Push Result ==="
          echo "Outcome: ${{ steps.docker-push.outcome }}"
          echo "Digest: ${{ steps.docker-push.outputs.digest }}"
          echo "ImageID: ${{ steps.docker-push.outputs.imageid }}"
          echo "=== Tags pushed ==="
          echo "${{ steps.meta.outputs.tags }}"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: navidrome
